<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Грамматика английского — разборы</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f2f4;--ink:#111114;--gray:#8a8a95;--line:#e2e2e7;--acc:#8b5cf6}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Montserrat',Arial,sans-serif;
  min-height:100vh;padding:48px 20px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto}
.kicker{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gray);font-weight:600}
h1{font-size:clamp(34px,9vw,64px);font-weight:800;line-height:.95;letter-spacing:-.02em;
  text-transform:uppercase;margin:14px 0 10px;
  background:linear-gradient(100deg,#6f6f7a,#111114 45%,#111114 65%,#7c7c88);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
p.lead{color:#4a4a52;max-width:520px}
ul{list-style:none;margin-top:34px;display:grid;gap:12px}
a.card{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;
  transition:transform .35s cubic-bezier(.16,1,.3,1),border-color .35s,box-shadow .35s}
a.card:hover{transform:translateY(-3px);border-color:#c4b5fd;
  box-shadow:0 24px 40px -30px rgba(80,40,160,.6)}
a.card i{width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:var(--acc);color:#fff;
  display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px}
a.card b{display:block;font-size:16px;font-weight:700}
a.card span{display:block;font-size:13px;color:var(--gray)}
footer{margin-top:44px;font-size:12px;color:var(--gray);border-top:1px solid var(--line);padding-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">English grammar</div>
  <h1>Разборы<br>по временам</h1>
  <p class="lead">Каждая тема — отдельная страница: объяснение, пошаговая диаграмма, видеоразбор и интерактивный тренажёр.</p>

  <ul>
    <li>
      <a class="card" href="present-perfect-continuous.html">
        <i>01</i>
        <span>
          <b>Present Perfect Continuous</b>
          <span>Формула, маркеры, stative verbs, 12 заданий</span>
        </span>
      </a>
    </li>
  </ul>

  <footer>Montserrat · #8B5CF6 · GitHub Pages</footer>
</div>
</body>
</html>
